# Builds the web version of the app and publishes it to GitHub Pages:
#   https://neomorrison.github.io/CPSC491-Project/
#
# Runs on every push to main that changes app/, and from the Actions tab ("Run workflow").
#
# Setup (once): Settings > Pages > Source: GitHub Actions, and add two repository
# variables (Settings > Secrets and variables > Actions > Variables):
#   EXPO_PUBLIC_SUPABASE_URL              the project URL
#   EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY  the publishable key (public, safe in a web app)
# Never put the secret / service role key here.

name: Deploy app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push replaces a waiting one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Build the web version
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npx expo export --platform web

      # a refresh on any path still opens the app
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
