<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Flow Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* board */
  --board: #e7e5e0;
  --dot: #cfccc5;
  --label: #55534e;
  --arrow: #ff5b2e;
  /* app */
  --bg: #f6f5f2;
  --card: #ffffff;
  --ink: #17171c;
  --muted: #74737a;
  --line: #e8e6e1;
  --ember: #ff5b2e;
  --ember-soft: #fff0ea;
  --xp: #6c4cf1;
  --xp-soft: #efebff;
  --mint: #18a874;
  --mint-soft: #e5f6ef;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
i { display: inline-grid; width: 24px; height: 24px; flex: none; }
i svg { width: 100%; height: 100%; }
html, body { height: 100%; }
body {
  font-family: "Plus Jakarta Sans", system-ui, sans-serif;
  background: var(--board);
  color: var(--ink);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---------- board chrome ---------- */
#viewport {
  position: fixed; inset: 0;
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.2px);
  background-size: 24px 24px;
  cursor: grab; touch-action: none;
}
#viewport.dragging { cursor: grabbing; }
#board { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition: transform .45s cubic-bezier(.2,.8,.2,1); }
#board.instant { transition: none; }
#arrows { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

.topbar {
  position: fixed; left: 16px; top: 16px; right: 16px; z-index: 10;
  display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; pointer-events: none;
}
.panel {
  pointer-events: auto; background: #fff; border-radius: 14px; padding: 12px 16px;
  box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.08);
}
.panel h1 { font-size: 15px; font-weight: 800; }
.panel p { font-size: 12px; color: var(--muted); margin-top: 2px; }
.controls { display: flex; gap: 6px; align-items: center; }
.controls button {
  font: inherit; font-size: 13px; font-weight: 700; border: 1px solid var(--line); background: #fff;
  border-radius: 9px; height: 32px; min-width: 32px; padding: 0 10px; cursor: pointer; color: var(--ink);
}
.controls button:hover { background: var(--bg); }
.controls .zoom { font-size: 12px; color: var(--muted); width: 44px; text-align: center; }

.row-label { position: absolute; font-size: 22px; font-weight: 800; color: var(--label); white-space: nowrap; }
.row-label span { display: block; font-size: 14px; font-weight: 500; margin-top: 2px; }

.frame-wrap { position: absolute; }
.frame-title {
  font-size: 14px; font-weight: 700; color: var(--label); margin-bottom: 10px;
  display: flex; gap: 8px; align-items: center;
}
.frame-title b { background: var(--ink); color: #fff; font-size: 11px; border-radius: 6px; padding: 2px 7px; }
.frame-wrap.focus .phone { box-shadow: 0 0 0 4px var(--arrow), 0 20px 50px rgba(0,0,0,.18); }

.arrow-label {
  position: absolute; transform: translate(-50%, -50%); white-space: nowrap;
  background: var(--arrow); color: #fff; font-size: 12px; font-weight: 700;
  padding: 4px 10px; border-radius: 999px; box-shadow: 0 2px 8px rgba(255,91,46,.35); pointer-events: none;
}
.back-note {
  position: absolute; white-space: nowrap; font-size: 12px; font-weight: 700; color: var(--label);
  background: #fff; border: 1.5px dashed #b9b6ae; padding: 4px 10px; border-radius: 999px;
}

.note {
  position: absolute; width: 420px; background: #fffbe6; border: 1px solid #f1e3a1; border-radius: 12px;
  padding: 16px 18px; font-size: 14px; line-height: 1.5; color: #4d4630; box-shadow: 0 6px 18px rgba(0,0,0,.06);
}
.note h3 { font-size: 15px; margin-bottom: 6px; color: #2f2a1a; }
.note ul { padding-left: 18px; }

/* ---------- phone ---------- */
.phone {
  width: 300px; height: 640px; border-radius: 40px; background: var(--bg);
  border: 8px solid #111; position: relative; overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,.16); display: flex; flex-direction: column;
  transition: box-shadow .3s;
}
.phone.dark { background: #15131f; color: #fff; }
.status { height: 34px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 12px; font-weight: 700; }
.status .pill { width: 74px; height: 20px; background: #111; border-radius: 12px; }
.status i { width: 14px; height: 14px; }
.scr { flex: 1; padding: 6px 18px 18px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.scr.center { justify-content: center; text-align: center; }

.t-xl { font-size: 26px; font-weight: 800; line-height: 1.15; letter-spacing: -.02em; }
.t-lg { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.t-md { font-size: 14px; font-weight: 700; }
.t-sm { font-size: 12px; color: var(--muted); }
.dark .t-sm { color: #a9a5bd; }
.t-xs { font-size: 11px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 8px; }
.between { justify-content: space-between; }
.grow { flex: 1; }

.card { background: var(--card); border-radius: 18px; padding: 14px; border: 1px solid var(--line); }
.btn {
  height: 48px; border-radius: 14px; background: var(--ink); color: #fff; display: flex; align-items: center;
  justify-content: center; gap: 8px; font-weight: 700; font-size: 15px; flex: none;
}
.btn.ember { background: var(--ember); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.dark .btn.ghost { color: #fff; border-color: #3a3550; }
.btn i { width: 18px; height: 18px; }
.link { text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.spacer { flex: 1; }

.hot { position: relative; border-radius: 14px; outline: 2px dashed transparent; outline-offset: 3px; cursor: pointer; transition: outline-color .2s; }
.show-hot .hot { outline-color: rgba(255,91,46,.55); }

.field { background: #fff; border: 1.5px solid var(--line); border-radius: 12px; height: 46px; display: flex; align-items: center; padding: 0 12px; gap: 10px; font-size: 14px; color: var(--muted); }
.field i { width: 16px; height: 16px; }
.field.filled { color: var(--ink); border-color: var(--ink); }
.label { font-size: 12px; font-weight: 700; margin-bottom: -6px; }

.option { background: #fff; border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; display: flex; gap: 12px; align-items: center; }
.option.on { border-color: var(--ember); background: var(--ember-soft); }
.ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--bg); flex: none; }
.ico i { width: 18px; height: 18px; }
.ico.ember { background: var(--ember-soft); color: var(--ember); }
.ico.xp { background: var(--xp-soft); color: var(--xp); }
.ico.mint { background: var(--mint-soft); color: var(--mint); }
.radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); margin-left: auto; flex: none; }
.on .radio { border: 6px solid var(--ember); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { height: 34px; padding: 0 12px; border-radius: 10px; background: #fff; border: 1.5px solid var(--line); display: flex; align-items: center; font-size: 13px; font-weight: 600; gap: 6px; }
.chip.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip i { width: 14px; height: 14px; }
.day { width: 32px; padding: 0; justify-content: center; }

.bar { height: 10px; border-radius: 99px; background: var(--xp-soft); overflow: hidden; }
.bar > div { height: 100%; border-radius: 99px; background: var(--xp); }
.dark .bar { background: #2b2640; }

.tabbar { height: 64px; flex: none; background: #fff; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-around; padding: 0 8px 6px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 700; color: var(--muted); padding: 4px 6px; border-radius: 10px; }
.tab i { width: 20px; height: 20px; }
.tab.on { color: var(--ink); }
.tab.plus { width: 44px; height: 44px; border-radius: 14px; background: var(--ember); color: #fff; justify-content: center; }

.list-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.list-row:last-child { border-bottom: 0; }
.chev { width: 16px; height: 16px; color: var(--muted); margin-left: auto; }

.toggle { width: 38px; height: 22px; border-radius: 99px; background: #d8d6d0; position: relative; flex: none; margin-left: auto; }
.toggle::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
.toggle.on { background: var(--mint); }
.toggle.on::after { left: 19px; }

.ring { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.ring > div { width: 50px; height: 50px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-weight: 800; font-size: 14px; }

.badge { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 99px; background: var(--xp-soft); color: var(--xp); }
.badge.ember { background: var(--ember-soft); color: var(--ember); }
.badge.mint { background: var(--mint-soft); color: var(--mint); }

.medal { aspect-ratio: 1; border-radius: 16px; display: grid; place-items: center; background: #fff; border: 1px solid var(--line); }
.medal i { width: 24px; height: 24px; }
.medal.lock { background: #efeee9; color: #b5b2aa; }
.medals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

.chart { display: flex; align-items: flex-end; gap: 8px; height: 110px; padding-top: 6px; }
.chart > div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; font-size: 10px; color: var(--muted); font-weight: 600; }
.chart b { width: 100%; border-radius: 6px; background: var(--ember); display: block; }
.chart b.zero { background: var(--line); height: 4px; }

.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal div { aspect-ratio: 1; border-radius: 7px; background: #efeee9; font-size: 9px; display: grid; place-items: center; color: var(--muted); font-weight: 600; }
.cal .hit { background: var(--ember); color: #fff; }
.cal .today { outline: 2px solid var(--ink); outline-offset: 1px; }

.seg { display: flex; background: #ebe9e4; border-radius: 12px; padding: 3px; }
.seg div { flex: 1; text-align: center; font-size: 12px; font-weight: 700; padding: 7px 0; border-radius: 9px; color: var(--muted); }
.seg .on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

.bubble { background: #fff; border: 1px solid var(--line); border-radius: 16px 16px 16px 4px; padding: 10px 12px; font-size: 12.5px; line-height: 1.45; }
.bubble.me { background: var(--ink); color: #fff; border: 0; border-radius: 16px 16px 4px 16px; align-self: flex-end; }
.plan-day { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.plan-day:last-child { border: 0; }
.plan-day b { width: 34px; font-size: 12px; color: var(--muted); }

.back { display: flex; align-items: center; gap: 8px; }
.back i { width: 20px; height: 20px; }
</style>
</head>
<body>
<div id="viewport">
  <div id="board">
    <svg id="arrows"></svg>
  </div>
</div>

<div class="topbar">
  <div class="panel">
    <h1>Personal Fitness Monitor: app flow</h1>
    <p>Drag to move around, scroll or pinch to zoom. Click anything with an arrow to jump to the next screen.</p>
  </div>
  <div class="panel controls">
    <button id="hotBtn" title="Show tap targets">Tap targets</button>
    <button id="zoomOut" title="Zoom out">−</button>
    <div class="zoom" id="zoomLabel">100%</div>
    <button id="zoomIn" title="Zoom in">+</button>
    <button id="fitBtn">Fit</button>
  </div>
</div>

      ${backBar('Customize home', '<span class="t-md" style="color:var(--ember)">Done</span>')}

      <div class="card" style="padding:2px 14px">
        ${[['zap','Level progress',1],['flame','Streak',1],['target','Weekly goal',1],['trophy',"Today's challenge",1],['history','Recent workouts',1],['footprints','Steps',0],['droplets','Water',0],['moon','Sleep',0]]
          .map(([ic, n, on]) => `<div class="list-row" style="padding:6px 0">${icon('grip-vertical')}<div class="ico">${icon(ic)}</div><span class="t-md" style="font-size:13px">${n}</span><div class="toggle ${on ? 'on' : ''}"></div></div>`).join('')}

  // Row 3: AI
  { id: 'aiconnect', name: 'Connect AI (optional)', col: 3, row: 3, html: `

  { id: 'aiplan', name: 'Suggested plan (from AI)', col: 4, row: 3, html: `
    <div class="scr" style="gap:10px">
      ${backBar('Weekly plan')}
      <div class="row" style="gap:8px;background:var(--xp-soft);border-radius:12px;padding:8px 10px"><div class="ico xp" style="width:28px;height:28px;background:#fff">${icon('sparkles')}</div><span class="t-md" style="font-size:12.5px;color:var(--xp)">Suggested by your assistant</span></div>
      <div class="bubble">You hit your goal 3 weeks in a row, so I bumped you to <b>4 days</b> this week. Squats are going up 5 lb.</div>

        <div class="plan-day"><b>MON</b><div class="ico mint">${icon('dumbbell')}</div><div class="grow">Lower body<div class="t-xs">35 min</div></div></div>
        <div class="plan-day"><b>WED</b><div class="ico ember">${icon('heart-pulse')}</div><div class="grow">Pickup basketball<div class="t-xs">45 min · swapped in at your request</div></div></div>
        <div class="plan-day"><b>FRI</b><div class="ico mint">${icon('dumbbell')}</div><div class="grow">Upper body<div class="t-xs">35 min</div></div></div>
        <div class="plan-day"><b>SAT</b><div class="ico xp">${icon('flower-2')}</div><div class="grow">Stretch + core<div class="t-xs">20 min</div></div></div>
      </div>
      <div class="spacer"></div>
      <div class="btn ember" data-back="Home">Accept plan</div>
      <div class="row" style="gap:8px"><div class="btn ghost" style="flex:1">Edit</div><div class="btn ghost" style="flex:1">Dismiss</div></div>
    </div>` },
];

const rows = [
  { title: 'Onboarding', sub: 'First time opening the app' },
  { title: 'Core loop', sub: 'Log a workout, earn XP, level up' },
  { title: 'Tabs', sub: 'Progress, awards, profile' },
  { title: 'AI assistant', sub: 'Optional. Reads your logs for advice and suggests plans you approve.' },
];

// ---------- layout ----------
const W = 300, H = 640, GX = 170, GY = 230, LABEL = 120, TITLE = 30;
const board = document.getElementById('board');
const svg = document.getElementById('arrows');
const rowY = (r) => r * (H + TITLE + GY) + 60;
const colX = (c) => LABEL + 200 + c * (W + GX);

rows.forEach((r, i) => {
  const el = document.createElement('div');
  el.className = 'row-label';
  el.style.left = '0px';
  el.style.top = rowY(i) + TITLE + 'px';
  el.style.width = '260px';
  el.style.whiteSpace = 'normal';
  el.innerHTML = `${r.title}<span>${r.sub}</span>`;
  board.appendChild(el);
});

screens.forEach((s, i) => {
  const wrap = document.createElement('div');
  wrap.className = 'frame-wrap';
  wrap.id = 'f-' + s.id;
  wrap.style.left = colX(s.col) + 'px';
  wrap.style.top = rowY(s.row) + 'px';
  wrap.innerHTML = `<div class="frame-title"><b>${i + 1}</b>${s.name}</div>
    <div class="phone ${s.dark ? 'dark' : ''}">${status(s.dark)}${s.html}</div>`;
  board.appendChild(wrap);
});

const note = document.createElement('div');
note.className = 'note';
note.style.left = colX(4) + 'px';
note.style.top = rowY(0) + TITLE + 'px';
note.innerHTML = `<h3>Notes for the team</h3><ul>
  <li>Orange arrows are taps that go to a new screen. Dashed tags mean "goes back to Home".</li>
  <li>The orange + in the tab bar opens Log workout from anywhere.</li>
  <li>XP numbers follow the gamification engine design in the proposal: +50 per workout, +5 per streak day (max +30), Level 7 to 8 takes 700 XP.</li>
  <li>Colors: ember orange for streaks and actions, purple for XP and levels, green for done.</li>
  <li>This is a starting point for Gala to restyle in Figma.</li></ul>`;
board.appendChild(note);

const W_BOARD = colX(4) + W + 220, H_BOARD = rowY(3) + H + TITLE + 120;
board.style.width = W_BOARD + 'px';
board.style.height = H_BOARD + 'px';
svg.setAttribute('width', W_BOARD);
svg.setAttribute('height', H_BOARD);


// ---------- pan + zoom ----------
let scale = 1, tx = 0, ty = 0;
const viewport = document.getElementById('viewport');
const zoomLabel = document.getElementById('zoomLabel');
function apply(instant) {
  board.classList.toggle('instant', !!instant);
  board.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  zoomLabel.textContent = Math.round(scale * 100) + '%';
}
function zoomAt(f, cx, cy, instant) {
  const ns = Math.min(2, Math.max(0.12, scale * f));
  tx = cx - (cx - tx) * (ns / scale);
  ty = cy - (cy - ty) * (ns / scale);
  scale = ns;
  apply(instant);
}
function fit() {
  const vw = innerWidth, vh = innerHeight - 90;
  scale = Math.min(vw / W_BOARD, vh / H_BOARD) * 0.96;
  tx = (vw - W_BOARD * scale) / 2;
  ty = 90 + (vh - H_BOARD * scale) / 2;
  apply();
}
function focusScreen(id) {
  const s = screens.find((x) => x.id === id);
  const vw = innerWidth, vh = innerHeight;
  scale = Math.min(1, (vh - 140) / (H + TITLE));
  tx = vw / 2 - (colX(s.col) + W / 2) * scale;
  ty = (vh + 60) / 2 - (rowY(s.row) + (H + TITLE) / 2) * scale;
  apply();
  document.querySelectorAll('.frame-wrap.focus').forEach((e) => e.classList.remove('focus'));
  document.getElementById('f-' + id).classList.add('focus');
}

viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY, true);
  else { tx -= e.deltaX; ty -= e.deltaY; apply(true); }
}, { passive: false });

const pointers = new Map();
let drag = null, pinch = null, moved = false;
viewport.addEventListener('pointerdown', (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = false;
  if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, tx, ty };
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), scale };
    drag = null;
  }
});
viewport.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; viewport.classList.add('dragging'); viewport.setPointerCapture(e.pointerId); }
    tx = drag.tx + dx; ty = drag.ty + dy; apply(true);
  } else if (pinch && pointers.size === 2) {
    moved = true;
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((pinch.scale * d / pinch.d) / scale, (a.x + b.x) / 2, (a.y + b.y) / 2, true);
  }
});
const up = (e) => { pointers.delete(e.pointerId); if (pointers.size === 0) { drag = null; pinch = null; viewport.classList.remove('dragging'); } };
viewport.addEventListener('pointerup', up);
viewport.addEventListener('pointercancel', up);
viewport.addEventListener('click', (e) => {
  if (moved) return;
  const hot = e.target.closest('[data-to]');
  if (hot) focusScreen(hot.dataset.to);
});

document.getElementById('zoomIn').onclick = () => zoomAt(1.25, innerWidth / 2, innerHeight / 2);
document.getElementById('zoomOut').onclick = () => zoomAt(0.8, innerWidth / 2, innerHeight / 2);
document.getElementById('fitBtn').onclick = () => { document.querySelectorAll('.frame-wrap.focus').forEach((e) => e.classList.remove('focus')); fit(); };
document.getElementById('hotBtn').onclick = (e) => { document.body.classList.toggle('show-hot'); e.currentTarget.classList.toggle('on'); };

// ---------- arrows ----------
// Measure elements in board coordinates (offset chain, unaffected by the zoom transform).
function boxOf(el) {
  let x = 0, y = 0, n = el;
  while (n && n !== board) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
  return { x, y, w: el.offsetWidth, h: el.offsetHeight };
}
function drawArrows() {
  svg.innerHTML = `<defs><marker id="head" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--arrow)"/></marker></defs>`;
  board.querySelectorAll('.arrow-label, .back-note').forEach((e) => e.remove());

  board.querySelectorAll('.frame-wrap').forEach((wrap) => {
    const from = screens.find((s) => 'f-' + s.id === wrap.id);
    wrap.querySelectorAll('[data-to]').forEach((hot) => {
      const to = screens.find((s) => s.id === hot.dataset.to);
      const h = boxOf(hot);
      const t = boxOf(document.getElementById('f-' + to.id).querySelector('.phone'));
      let sx, sy, ex, ey, c1, c2;
      if (to.row === from.row && to.col > from.col) {
        // same row, to the right
        sx = colX(from.col) + W + 4; sy = h.y + h.h / 2;
        ex = t.x - 6; ey = Math.min(Math.max(sy, t.y + 60), t.y + t.h - 60);
        const k = (ex - sx) / 2;
        c1 = [sx + k, sy]; c2 = [ex - k, ey];
      } else if (to.row > from.row || (to.row === from.row && to.col < from.col)) {
        // below: leave from the bottom of the tap target, enter the top of the screen
        sx = h.x + h.w / 2; sy = h.y + h.h;
        ex = t.x + t.w / 2; ey = t.y - TITLE - 4;
        const k = Math.max(80, (ey - sy) / 2);
        c1 = [sx, sy + k]; c2 = [ex, ey - k];
      } else {
        // above: leave from the side of the frame next to the tap target, enter the bottom of the screen
        const left = to.col < from.col;
        sx = left ? colX(from.col) - 4 : colX(from.col) + W + 4; sy = h.y + h.h / 2;
        ex = t.x + t.w / 2; ey = t.y + t.h + 6;
        c1 = [sx + (left ? -90 : 90), sy]; c2 = [ex, ey + 140];
      }
      const d = `M${sx},${sy} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${ex},${ey}`;
      svg.insertAdjacentHTML('beforeend',
        `<path d="${d}" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".9"/>
         <path d="${d}" fill="none" stroke="var(--arrow)" stroke-width="3" stroke-linecap="round" marker-end="url(#head)"/>
         <circle cx="${sx}" cy="${sy}" r="5" fill="var(--arrow)" stroke="#fff" stroke-width="2"/>`);
      // label at the curve midpoint (t = .5)
      const mx = (sx + 3 * c1[0] + 3 * c2[0] + ex) / 8, my = (sy + 3 * c1[1] + 3 * c2[1] + ey) / 8;
      const lab = document.createElement('div');
      lab.className = 'arrow-label';
      lab.style.left = mx + 'px'; lab.style.top = my + 'px';
      lab.textContent = hot.dataset.label;
      board.appendChild(lab);
    });
    wrap.querySelectorAll('[data-back]').forEach((el) => {
      const b = boxOf(el);
      const tag = document.createElement('div');
      tag.className = 'back-note';
      tag.style.left = colX(from.col) + W + 14 + 'px';
      tag.style.top = b.y + b.h / 2 - 13 + 'px';
      tag.textContent = '↩ back to ' + el.dataset.back;
      board.appendChild(tag);
    });
  });
}

fit();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(drawArrows);
</script>
